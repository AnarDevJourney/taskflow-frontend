<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-64.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/logo-256.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <script>
      // Applies the resolved theme to <html> before first paint, so there's
      // no light-mode flash before React mounts and ThemeProvider runs.
      // Mirrors ThemeProvider's own resolution logic exactly — keep both in
      // sync if the storage key or fallback logic ever changes.
      (function () {
        try {
          var stored = localStorage.getItem("taskflow-theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var resolved =
            theme === "system"
              ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : theme;
          document.documentElement.setAttribute("data-theme", resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
